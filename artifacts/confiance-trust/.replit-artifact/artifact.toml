kind = "web"
previewPath = "/"
title = "Confiance"
description = "A front-end prototype for a South African trust and customer loyalty platform, with connected brand, creator, and customer experiences powered by shared simulated demo data."
version = "1.0.0"
id = "artifacts/confiance-trust"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22614

[services.development]
run = "pnpm --filter @workspace/confiance-trust run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/confiance-trust", "run", "build" ]
serve = "static"
publicDir = "artifacts/confiance-trust/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22614"
BASE_PATH = "/"
